name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A stuck step must go red, not hold a runner for six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Explicit runner labels rather than ubuntu-latest: the "latest" image is
        # now Ubuntu 26.04, which has no Python 3.9 build, so the oldest version
        # we claim to support needs an image that still ships it.
        # The oldest supported Python is covered on Linux, which is where the
        # 3.9 image still exists; the platform-specific jobs run the newest
        # interpreter, which is what the installer build uses. Six jobs here
        # meant Windows and macOS sat queued for over an hour on every push,
        # which is slower than the coverage was worth.
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Install the project itself, not just pytest. Without this the suite runs
      # against whatever source tree happens to be on sys.path because of the
      # working directory, which hides packaging mistakes (a missing data file,
      # a module that is never included in the distribution).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Environment
        run: |
          python -c "import platform,sys;print('python', sys.version);print('platform', platform.platform())"
          python -c "import usbdoctor, pathlib;print('usbdoctor from', pathlib.Path(usbdoctor.__file__).parent)"
          python -m pytest --version

      - name: Engine, CLI and web API (no GUI dependency)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=short -ra \
            --junitxml=junit.xml 2>&1 | tee pytest.log

      # Job logs live on a storage host that is not always reachable, but
      # annotations are part of the API. Publishing each failure as an
      # annotation means a red build always says *which test broke and why*
      # instead of only "exit code 1".
      - name: Report failures
        if: failure()
        shell: bash
        run: python .github/scripts/report_failures.py junit.xml pytest.log || true

      # PySide6 ships the Qt libraries but links against the system's graphics
      # and X stacks. Without these, importing QtWidgets raises
      # "libGL.so.1: cannot open shared object file" and the whole desktop test
      # module fails at collection — which is what turned this job red while
      # every other platform was fine.
      - name: Install the Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-util1

      - name: Install the desktop dependency
        run: python -m pip install "PySide6-Essentials>=6.5"

      - name: Prove Qt can start before running UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt', app.platformName(), 'ready')"

      - name: Desktop UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        shell: bash
        # The suite takes half an hour on a Windows runner. Without a ceiling a
        # single stuck test holds the job open until the six-hour default, which
        # is how one stuck packaging test turned into a ninety-minute job.
        timeout-minutes: 45
        run: |
          # Redirect instead of piping through tee: a test that leaves a child
          # process holding stdout keeps the pipe open long after pytest exits,
          # and the log - the only thing that explains a failure - never flushes.
          python -u -m pytest tests -q --tb=short -ra --durations=15 \
            --timeout=180 --timeout-method=thread \
            --junitxml=junit-ui.xml > pytest-ui.log 2>&1 || status=$?
          tail -c 3000 pytest-ui.log
          exit "${status:-0}"

      - name: Report UI failures
        if: failure()
        shell: bash
        run: python .github/scripts/report_failures.py junit-ui.xml pytest-ui.log || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit*.xml
            pytest*.log
          if-no-files-found: ignore

  package:
    name: Packaged self-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A stuck step must go red, not hold a runner for six hours.
    timeout-minutes: 60
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,package,dev]"

      # Runs the real spec, freezes the app and drives `selfcheck` inside the
      # frozen product. Catches the class of bug where the GUI works from source
      # but the packaged application is missing a lazily-imported module.
      - name: Freeze and self-check
        shell: bash
        run: |
          set -o pipefail
          python tools/build_release.py --skip-tests --portable-only --json 2>&1 | tee freeze.log

      - name: Report packaging failures
        if: failure()
        shell: bash
        run: |
          tail -c 3000 freeze.log 2>/dev/null | tr '\n' ' ' | sed 's/^/::error::packaging failed: /' || true

      - name: Upload the frozen product on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-package-${{ matrix.os }}
          path: |
            dist/**
            freeze.log
          if-no-files-found: ignore
          retention-days: 5
