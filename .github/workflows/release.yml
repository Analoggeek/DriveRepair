name: Release installers

# Builds fully offline installers for Windows and macOS.
#
# PyInstaller cannot cross-compile, so each installer is built on its own native
# runner. Nothing in this workflow needs a secret: artifacts are unsigned unless
# signing credentials are configured (see docs/developer/BUILD.md).

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the artifacts (requires signing secrets to be configured)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest PySide6-Essentials
      - name: Unit + integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6-Essentials>=6.5" "pyinstaller>=6.0" "Pillow>=10.0" pytest

      - name: Install Inno Setup 6
        run: |
          choco install innosetup --yes --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build, verify and package
        run: python tools/build_release.py --json | Tee-Object -FilePath build-report.json

      - name: Upload the offline installer
        uses: actions/upload-artifact@v4
        with:
          name: USBDoctorAI-Windows-x64
          path: |
            dist/USBDoctorAI-Setup-*.exe
            dist/USBDoctorAI-*-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/USBDoctorAI-Setup-*.exe
            dist/USBDoctorAI-*-portable.zip
          fail_on_unmatched_files: true

  macos:
    name: macOS disk image
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            label: AppleSilicon
          - runner: macos-13
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6-Essentials>=6.5" "pyinstaller>=6.0" "Pillow>=10.0" pytest

      - name: Build, verify and package
        run: python tools/build_release.py --json | tee build-report.json

      - name: Report the bundle architecture
        run: |
          lipo -archs "dist/USBDoctorAI.app/Contents/MacOS/USBDoctorAI" || true
          ls -lh dist

      - name: Upload the offline disk image
        uses: actions/upload-artifact@v4
        with:
          name: USBDoctorAI-macOS-${{ matrix.label }}
          path: |
            dist/USBDoctorAI-*.dmg
            dist/USBDoctorAI-*-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/USBDoctorAI-*.dmg
            dist/USBDoctorAI-*-portable.zip
          fail_on_unmatched_files: true
