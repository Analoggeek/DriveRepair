name: Release installers

# Builds fully offline installers for Windows and macOS.
#
# PyInstaller cannot cross-compile, so each installer is built on its own native
# runner. Nothing in this workflow needs a secret: artifacts are unsigned unless
# signing credentials are configured (see docs/developer/BUILD.md).

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the artifacts (requires signing secrets to be configured)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # A build that hangs is killed; without this its output dies in the buffer and
  # the log we need for diagnosis is empty.
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"
      # PySide6 links against the system graphics/X stack; without these the
      # desktop tests fail at collection on a bare Ubuntu runner and the whole
      # release is blocked by a test that never ran.
      - name: Install the Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-util1
      - name: Unit + integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --tb=short -ra

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    # A stalled queue must become a red run, not a permanently pending one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,package,dev]"

      - name: Install Inno Setup 6
        run: |
          choco install innosetup --yes --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build, verify and package
        shell: bash
        timeout-minutes: 60
        run: |
          # No pipe: on Windows the tee pipeline left an empty log, which is the
          # one thing a failed build cannot afford. Redirect, then report the
          # tail from the same step so the annotation cannot be lost either.
          if python -u tools/build_release.py --json > build-report.log 2>&1; then
            tail -c 1200 build-report.log
          else
            status=$?
            echo "::error::build failed with exit $status"
            tail -c 2500 build-report.log | tr '\n' ' ' | sed 's/^/::error::build log tail: /'
            exit "$status"
          fi

      # Job logs are served from storage that is not always reachable, while
      # annotations travel over the normal API. Publish the tail of the build log
      # so a failed build says where it stopped instead of only "exit code 1".
      - name: Report the build failure
        if: failure() || cancelled()
        shell: bash
        run: |
          tail -c 2500 build-report.log 2>/dev/null | tr '\n' ' ' | sed 's/^/::error::build log tail: /' || true

      - name: Upload the build log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: |
            build-report.log
            dist/**
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload the offline installer
        uses: actions/upload-artifact@v4
        with:
          name: USBDoctorAI-Windows-x64
          path: |
            dist/USBDoctorAI-Setup-*.exe
            dist/USBDoctorAI-*-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/USBDoctorAI-Setup-*.exe
            dist/USBDoctorAI-*-portable.zip
          fail_on_unmatched_files: true

  macos:
    name: macOS disk image
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Live labels only. macos-13 (Intel) was retired in December 2025: GitHub
        # keeps accepting jobs for a retired label but no runner ever claims one,
        # so the Intel leg sat queued for 80 minutes looking perfectly healthy.
        # macos-14 was retired on 2 November 2026 and now fails outright.
        # macos-15-intel is the last Intel image GitHub will publish; Apple has
        # ended x86_64 support and this label is expected to retire in 2027.
        include:
          - runner: macos-15
            arch: arm64
            label: AppleSilicon
          - runner: macos-15-intel
            arch: x64
            label: Intel
    runs-on: ${{ matrix.runner }}
    # A stalled queue must become a red run, not a permanently pending one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,package,dev]"

      - name: Build, verify and package
        shell: bash
        timeout-minutes: 60
        run: |
          # No pipe: on Windows the tee pipeline left an empty log, which is the
          # one thing a failed build cannot afford. Redirect, then report the
          # tail from the same step so the annotation cannot be lost either.
          if python -u tools/build_release.py --json > build-report.log 2>&1; then
            tail -c 1200 build-report.log
          else
            status=$?
            echo "::error::build failed with exit $status"
            tail -c 2500 build-report.log | tr '\n' ' ' | sed 's/^/::error::build log tail: /'
            exit "$status"
          fi

      - name: Report the build failure
        if: failure() || cancelled()
        shell: bash
        run: |
          tail -c 2500 build-report.log 2>/dev/null | tr '\n' ' ' | sed 's/^/::error::build log tail: /' || true

      - name: Upload the build log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log-${{ matrix.arch }}
          path: |
            build-report.log
            dist/**
          if-no-files-found: ignore
          retention-days: 5

      - name: Report the bundle architecture
        run: |
          lipo -archs "dist/USBDoctorAI.app/Contents/MacOS/USBDoctorAI" || true
          ls -lh dist

      - name: Upload the offline disk image
        uses: actions/upload-artifact@v4
        with:
          name: USBDoctorAI-macOS-${{ matrix.label }}
          path: |
            dist/USBDoctorAI-*.dmg
            dist/USBDoctorAI-*-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/USBDoctorAI-*-${{ matrix.arch }}.dmg
            dist/USBDoctorAI-*-${{ matrix.arch }}-portable.zip
          fail_on_unmatched_files: true
