name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Engine, CLI and web API (no GUI dependency)
        run: python -m pytest tests -q
      - name: Install the desktop dependency
        run: pip install "PySide6-Essentials>=6.5"
      - name: Desktop UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  package:
    name: Packaged self-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6-Essentials>=6.5" "pyinstaller>=6.0" "Pillow>=10.0" pytest
      # Runs the real spec, freezes the app and drives `selfcheck` inside the
      # frozen product. Catches the class of bug where the GUI works from source
      # but the packaged application is missing a lazily-imported module.
      - name: Freeze and self-check
        run: python tools/build_release.py --skip-tests --portable-only --json
        shell: bash
